name: Checks
# Test + build gate. Runs on every push to main and on pull requests (and via
# manual dispatch). Complements publish.yaml (which only builds/pushes the
# image): this surfaces failing Go tests, a broken frontend build, or invalid
# e2e specs BEFORE/independently of the image build.
#
# Runs on the in-cluster Forgejo runner (label `docker`). Each job uses a pinned
# toolchain container matching the Dockerfile (golang:1.25-alpine, node:22-alpine).
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  go:
    runs-on: docker
    # Pin the exact patch so the image's Go matches go.mod's `go 1.25.7`, and
    # force GOTOOLCHAIN=local so the job never tries to download a toolchain at
    # runtime (a stale cached `golang:1.25-alpine` < 1.25.7 would otherwise
    # attempt that and fail).
    container:
      image: golang:1.25.7-alpine
    env:
      GOTOOLCHAIN: local
    steps:
      - name: Tools
        run: apk add --no-cache git build-base

      - name: Checkout
        run: |
          git config --global --add safe.directory '*'
          host="${GITHUB_SERVER_URL#*://}"; scheme="${GITHUB_SERVER_URL%%://*}"
          git clone --filter=blob:none \
            "${scheme}://token:${{ github.token }}@${host}/${GITHUB_REPOSITORY}.git" src
          cd src && git checkout "$GITHUB_SHA" && git rev-parse HEAD

      - name: pandoc (the production image's version)
        # Docs import/export tests skip without pandoc. Install exactly what
        # the runtime image ships, reading version + checksum from the
        # Dockerfile so the two cannot drift.
        run: |
          v=$(sed -n 's/^ARG PANDOC_VERSION=//p' src/Dockerfile)
          sum=$(sed -n 's/.*amd64) sum=\([0-9a-f]*\).*/\1/p' src/Dockerfile)
          wget -qO /tmp/pandoc.tgz "https://github.com/jgm/pandoc/releases/download/${v}/pandoc-${v}-linux-amd64.tar.gz"
          echo "$sum  /tmp/pandoc.tgz" | sha256sum -c -
          tar -xzf /tmp/pandoc.tgz -C /usr/local/bin --strip-components 2 "pandoc-${v}/bin/pandoc"
          pandoc --version | head -1

      - name: Generate protobuf code
        # gen/ (gRPC + grpc-gateway stubs) is gitignored and regenerated here,
        # exactly as the Dockerfile build stage does — otherwise packages that
        # import gen/go/... fail to compile.
        run: |
          cd src
          go install github.com/bufbuild/buf/cmd/buf@v1.64.0
          buf dep update && buf generate

      - name: go vet
        run: cd src && go vet ./...

      - name: go test
        # DB-backed tests are gated on GROWN_TEST_DSN / PDF_TEST_DSN (unset
        # here) and skip cleanly; the go-db job runs them against Postgres.
        run: cd src && go test ./...

  go-db:
    # DB-backed Go tests: everything gated on GROWN_TEST_DSN / PDF_TEST_DSN.
    # Kept separate from the fast `go` job. The tests DROP and recreate the
    # grown schema, so they run against a throwaway Postgres service container
    # (reachable by its service name `postgres` on the job network) and with
    # -p 1, because the packages share one schema.
    runs-on: docker
    container:
      image: golang:1.25.7-alpine
    services:
      postgres:
        image: postgres:17.2-alpine
        env:
          POSTGRES_USER: grown
          POSTGRES_DB: grown_test
          POSTGRES_HOST_AUTH_METHOD: trust
    env:
      GOTOOLCHAIN: local
      GROWN_TEST_DSN: postgres://grown@postgres:5432/grown_test?sslmode=disable
      PDF_TEST_DSN: postgres://grown@postgres:5432/grown_test_pdf?sslmode=disable
    steps:
      - name: Tools
        run: apk add --no-cache git build-base postgresql-client

      - name: Checkout
        run: |
          git config --global --add safe.directory '*'
          host="${GITHUB_SERVER_URL#*://}"; scheme="${GITHUB_SERVER_URL%%://*}"
          git clone --filter=blob:none \
            "${scheme}://token:${{ github.token }}@${host}/${GITHUB_REPOSITORY}.git" src
          cd src && git checkout "$GITHUB_SHA" && git rev-parse HEAD

      - name: Generate protobuf code
        run: |
          cd src
          go install github.com/bufbuild/buf/cmd/buf@v1.64.0
          buf dep update && buf generate

      - name: Wait for Postgres; create the PDF test database
        # The PDF app has its own database; its tests apply the pdf migrations.
        run: |
          for i in $(seq 1 60); do
            pg_isready -h postgres -U grown && break
            sleep 1
          done
          pg_isready -h postgres -U grown
          createdb -h postgres -U grown grown_test_pdf

      - name: go test (DB)
        run: cd src && go test -p 1 -count=1 ./...

  frontend:
    runs-on: docker
    container:
      image: node:22-alpine
    steps:
      - name: Tools
        run: apk add --no-cache git

      - name: Checkout
        run: |
          git config --global --add safe.directory '*'
          host="${GITHUB_SERVER_URL#*://}"; scheme="${GITHUB_SERVER_URL%%://*}"
          git clone --filter=blob:none \
            "${scheme}://token:${{ github.token }}@${host}/${GITHUB_REPOSITORY}.git" src
          cd src && git checkout "$GITHUB_SHA" && git rev-parse HEAD

      - name: web app — install, typecheck, unit tests
        # Type-check with tsc -b but skip the heavy vite bundle here: the image
        # build (publish.yaml) already runs the full `npm run build` on every
        # push, so bundling again is redundant and only makes this job slow
        # enough to get cancelled by the next push.
        run: |
          cd src/web/app
          npm ci --no-fund --no-audit
          npx tsc -b          # type-check (build/bundle covered by the image build)
          npm test            # vitest run

      - name: OnlyOffice parity scoreboard
        # docs/plans/onlyoffice-parity: counts `oo:` tags against the manifest
        # CSVs; fails only if ported/passing regresses vs baseline.json or a CSV
        # row is malformed. research/ is absent here, so OO counts are snapshots.
        run: |
          cd src/web/app
          rc=0
          node scripts/onlyoffice-parity.mjs --check --md > /tmp/parity.md || rc=$?
          cat /tmp/parity.md
          if [ -n "${GITHUB_STEP_SUMMARY:-}" ]; then cat /tmp/parity.md >> "$GITHUB_STEP_SUMMARY"; fi
          exit $rc

      - name: e2e specs — validate (no running stack needed)
        run: |
          cd src/web/e2e
          npm ci --no-fund --no-audit
          npx playwright test --list
