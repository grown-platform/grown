# S3 connection secret grown reads (mirrors the homelab grown-s3 secret shape).
# endpoint/bucket always live here. The credentials live in the secret named by
# grown.s3CredsSecret: {release}-rustfs for the bundled rustfs (generated once),
# rustfs.existingSecret, or — for an external S3 endpoint — this secret, from
# rustfs.external.accessKey/secretKey (falling back to the 0.1.x minio keys).
apiVersion: v1
kind: Secret
metadata:
  name: {{ .Release.Name }}-s3
  labels:
    {{- include "grown.labels" . | nindent 4 }}
    app.kubernetes.io/component: s3
type: Opaque
stringData:
  endpoint: {{ include "grown.s3Endpoint" . | quote }}
  bucket: {{ include "grown.bucket" . | quote }}
  {{- if and (not .Values.rustfs.enabled) (not .Values.rustfs.existingSecret) }}
  access_key: {{ .Values.rustfs.external.accessKey | default .Values.minio.accessKey | quote }}
  secret_key: {{ .Values.rustfs.external.secretKey | default .Values.minio.secretKey | quote }}
  {{- end }}
