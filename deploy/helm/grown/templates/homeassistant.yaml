{{- if .Values.homeAssistant.enabled }}
{{- $name := include "grown.haName" . }}
{{- $ha := .Values.homeAssistant }}
{{- $ownerSecret := include "grown.haOwnerSecret" . }}
# Home Assistant, installed with grown by default (homeAssistant.enabled).
# Grown still treats HA as bring-your-own: this instance is the
# deployment-default URL for the Home Assistant tile (GROWN_HOMEASSISTANT_URL);
# any org can point the tile at its own HA in Admin > Services instead.
#
# Pod layout:
#   init  seed-config             copy configuration.yaml & co. into /config
#                                 ONLY when missing (never clobbers)
#   init  grown-integration       download grown.zip from the grown Service
#                                 into /config/custom_components/grown (every
#                                 start; bounded wait, never blocks HA forever)
#   main  homeassistant           readiness = onboarding "user" step done, so
#                                 the Service/Ingress route nothing to a fresh,
#                                 un-owned HA
#   side  onboard                 creates the owner from the
#                                 <release>-homeassistant-owner Secret over
#                                 localhost and finishes onboarding, then keeps
#                                 HA's HTTP (reverse-proxy) config promoted
#                                 (idempotent)
{{- if and $ha.onboarding.enabled (not $ha.owner.existingSecret) }}
{{- $existing := (lookup "v1" "Secret" .Release.Namespace $ownerSecret) | default dict }}
{{- $data := (get $existing "data") | default dict }}
{{- $user := (get $data "username") | default "" | b64dec | default $ha.owner.username }}
{{- $pass := (get $data "password") | default "" | b64dec | default (randAlphaNum 32) }}
# Owner credentials for the onboarding sidecar. Generated once, then reused via
# lookup on every upgrade (`helm template`/--dry-run shows a fresh random value:
# expected). Kept on uninstall because the HA PVC (and the owner in it) is too.
apiVersion: v1
kind: Secret
metadata:
  name: {{ $ownerSecret }}
  labels:
    {{- include "grown.labels" . | nindent 4 }}
    app.kubernetes.io/component: homeassistant
  annotations:
    "helm.sh/resource-policy": keep
type: Opaque
data:
  username: {{ $user | b64enc | quote }}
  password: {{ $pass | b64enc | quote }}
---
{{- end }}
apiVersion: v1
kind: Service
metadata:
  name: {{ $name }}
  labels:
    {{- include "grown.labels" . | nindent 4 }}
    app.kubernetes.io/component: homeassistant
spec:
  selector:
    app.kubernetes.io/name: grown
    app.kubernetes.io/component: homeassistant
    app.kubernetes.io/instance: {{ .Release.Name }}
  ports:
    - name: http
      port: {{ $ha.port }}
      targetPort: http
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: {{ $name }}
  labels:
    {{- include "grown.labels" . | nindent 4 }}
    app.kubernetes.io/component: homeassistant
spec:
  serviceName: {{ $name }}
  # HA is single-instance (SQLite recorder + in-process state): never >1.
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: grown
      app.kubernetes.io/component: homeassistant
      app.kubernetes.io/instance: {{ .Release.Name }}
  template:
    metadata:
      labels:
        {{- include "grown.labels" . | nindent 8 }}
        app.kubernetes.io/component: homeassistant
      annotations:
        # Roll the pod when the seed/onboarding/fetch scripts change.
        checksum/seed: {{ include (print $.Template.BasePath "/homeassistant-seed.yaml") . | sha256sum }}
    spec:
      # Off on purpose: no mDNS/SSDP/Bluetooth discovery from the pod. Add
      # integrations by IP/hostname instead (see README).
      hostNetwork: false
      enableServiceLinks: false
      automountServiceAccountToken: false
      terminationGracePeriodSeconds: 60
      {{- with $ha.podSecurityContext }}
      securityContext:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      initContainers:
        - name: seed-config
          image: "{{ $ha.image.repository }}:{{ $ha.image.tag }}"
          imagePullPolicy: {{ $ha.image.pullPolicy }}
          command: ["/bin/sh", "/seed/seed.sh"]
          env:
            - { name: CONFIG_DIR, value: /config }
            - { name: SEED_DIR, value: /seed }
          {{- with $ha.securityContext }}
          securityContext:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          volumeMounts:
            - { name: config, mountPath: /config }
            - { name: seed, mountPath: /seed, readOnly: true }
          resources:
            requests: { cpu: 10m, memory: 16Mi }
            limits: { memory: 64Mi }
        {{- if $ha.grownIntegration.enabled }}
        # Install the grown custom integration from the grown Service on EVERY
        # start, so HA always runs the one matching the deployed Grown. Waits
        # up to fetchTimeoutSeconds for grown, then starts HA regardless.
        - name: grown-integration
          image: "{{ $ha.image.repository }}:{{ $ha.image.tag }}"
          imagePullPolicy: {{ $ha.image.pullPolicy }}
          command: ["python3", "/seed/fetch_integration.py"]
          env:
            - name: GROWN_ZIP_URL
              value: {{ include "grown.haIntegrationURL" . | quote }}
            - { name: CONFIG_DIR, value: /config }
            - name: FETCH_TIMEOUT_SECONDS
              value: {{ $ha.grownIntegration.fetchTimeoutSeconds | quote }}
            - { name: PYTHONDONTWRITEBYTECODE, value: "1" }
          {{- with $ha.securityContext }}
          securityContext:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          volumeMounts:
            - { name: config, mountPath: /config }
            - { name: seed, mountPath: /seed, readOnly: true }
          resources:
            requests: { cpu: 10m, memory: 32Mi }
            limits: { memory: 128Mi }
        {{- end }}
      containers:
        - name: homeassistant
          image: "{{ $ha.image.repository }}:{{ $ha.image.tag }}"
          imagePullPolicy: {{ $ha.image.pullPolicy }}
          {{- with $ha.securityContext }}
          securityContext:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          env:
            - name: TZ
              value: {{ $ha.timezone | quote }}
            {{- with $ha.extraEnv }}
            {{- toYaml . | nindent 12 }}
            {{- end }}
          ports:
            - { name: http, containerPort: 8123 }
          volumeMounts:
            - { name: config, mountPath: /config }
            {{- if $ha.onboarding.enabled }}
            - { name: seed, mountPath: /seed, readOnly: true }
            {{- end }}
          # First boot installs integrations' Python deps and can take minutes.
          startupProbe:
            tcpSocket: { port: http }
            periodSeconds: 10
            failureThreshold: 60
          readinessProbe:
            {{- if $ha.onboarding.enabled }}
            # Ready only once onboarding's "user" step is done: until the owner
            # exists, the Service has no endpoints, so neither the Ingress /
            # HTTPRoute nor anything else using the Service can reach the
            # first-run "create owner" page.
            exec:
              command: ["python3", "-B", "/seed/onboard.py", "--check"]
            timeoutSeconds: 5
            {{- else }}
            tcpSocket: { port: http }
            {{- end }}
            periodSeconds: 10
          livenessProbe:
            tcpSocket: { port: http }
            periodSeconds: 30
            failureThreshold: 5
          resources:
            {{- toYaml $ha.resources | nindent 12 }}
        {{- if $ha.onboarding.enabled }}
        # Creates the owner over localhost the moment HA's HTTP server is up
        # (polls every second), then re-checks every recheckSeconds so a wiped
        # /config/.storage is re-onboarded too. Idempotent. Needs only the
        # network, so it runs as nobody with a read-only root filesystem.
        - name: onboard
          image: "{{ $ha.image.repository }}:{{ $ha.image.tag }}"
          imagePullPolicy: {{ $ha.image.pullPolicy }}
          command: ["python3", "-u", "/seed/onboard.py"]
          env:
            - { name: HA_URL, value: "http://127.0.0.1:8123" }
            - name: OWNER_USERNAME
              valueFrom:
                secretKeyRef: { name: {{ $ownerSecret }}, key: username }
            - name: OWNER_PASSWORD
              valueFrom:
                secretKeyRef: { name: {{ $ownerSecret }}, key: password }
            - name: OWNER_NAME
              value: {{ $ha.owner.name | quote }}
            - name: OWNER_LANGUAGE
              value: {{ $ha.owner.language | quote }}
            - name: RECHECK_SECONDS
              value: {{ $ha.onboarding.recheckSeconds | quote }}
            # HA 2026.9+ puts http: settings on a 5-minute trial and reverts
            # them unless promoted; the sidecar promotes (or re-applies) the
            # reverse-proxy settings below over the websocket API.
            - name: HTTP_MANAGE
              value: {{ $ha.http.manage | quote }}
            - name: HTTP_TRUSTED_PROXIES
              value: {{ join "," $ha.trustedProxies | quote }}
            - name: HTTP_USE_X_FRAME_OPTIONS
              value: {{ $ha.http.useXFrameOptions | quote }}
            - { name: PYTHONDONTWRITEBYTECODE, value: "1" }
          securityContext:
            runAsNonRoot: true
            runAsUser: 65534
            runAsGroup: 65534
            readOnlyRootFilesystem: true
            allowPrivilegeEscalation: false
            privileged: false
            capabilities:
              drop: ["ALL"]
          volumeMounts:
            - { name: seed, mountPath: /seed, readOnly: true }
          resources:
            requests: { cpu: 5m, memory: 24Mi }
            limits: { memory: 64Mi }
        {{- end }}
      volumes:
        - name: seed
          configMap:
            name: {{ $name }}-seed
        {{- if $ha.persistence.existingClaim }}
        - name: config
          persistentVolumeClaim:
            claimName: {{ $ha.persistence.existingClaim }}
        {{- end }}
  {{- if not $ha.persistence.existingClaim }}
  # config-<release>-homeassistant-0 holds ALL of HA's state (config, .storage,
  # the recorder DB). Kubernetes never deletes volumeClaimTemplate PVCs on
  # `helm uninstall`/upgrade.
  volumeClaimTemplates:
    - metadata:
        name: config
      spec:
        accessModes: ["ReadWriteOnce"]
        {{- with ($ha.persistence.storageClass | default .Values.storageClass) }}
        storageClassName: {{ . | quote }}
        {{- end }}
        resources:
          requests:
            storage: {{ $ha.persistence.size }}
  {{- end }}
{{- if ne .Values.ingress.type "none" }}
---
{{- $host := include "grown.haHost" . }}
{{- if eq .Values.ingress.type "ingress" }}
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: {{ $name }}
  labels:
    {{- include "grown.labels" . | nindent 4 }}
    app.kubernetes.io/component: homeassistant
  {{- with (merge (dict) ($ha.ingress.annotations | default dict) (.Values.ingress.annotations | default dict)) }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
spec:
  {{- if .Values.ingress.className }}
  ingressClassName: {{ .Values.ingress.className }}
  {{- end }}
  {{- if .Values.ingress.tls.enabled }}
  tls:
    - hosts:
        - {{ $host | quote }}
      secretName: {{ $ha.ingress.tlsSecretName | default .Values.ingress.tls.secretName }}
  {{- end }}
  rules:
    - host: {{ $host | quote }}
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: {{ $name }}
                port:
                  number: {{ $ha.port }}
{{- else if eq .Values.ingress.type "httproute" }}
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: {{ $name }}
  labels:
    {{- include "grown.labels" . | nindent 4 }}
    app.kubernetes.io/component: homeassistant
spec:
  parentRefs:
    - name: {{ .Values.ingress.httproute.gatewayName }}
      namespace: {{ .Values.ingress.httproute.gatewayNamespace }}
  hostnames:
    - {{ $host | quote }}
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /
      backendRefs:
        - name: {{ $name }}
          port: {{ $ha.port }}
{{- end }}
{{- end }}
{{- end }}
