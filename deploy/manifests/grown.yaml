            - { name: CONFIG_DIR, value: /config }
            - name: FETCH_TIMEOUT_SECONDS
              value: "180"
            - { name: PYTHONDONTWRITEBYTECODE, value: "1" }
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
              - ALL
            privileged: false
          volumeMounts:
            - { name: config, mountPath: /config }
            - { name: seed, mountPath: /seed, readOnly: true }
