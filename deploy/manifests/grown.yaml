# Source: grown/templates/zitadel.yaml
apiVersion: apps/v1
kind: Deployment
metadata:
  name: grown-zitadel
  labels:
    app.kubernetes.io/name: grown
    app.kubernetes.io/instance: grown
    app.kubernetes.io/managed-by: Helm
    helm.sh/chart: grown-0.3.0
    app.kubernetes.io/component: zitadel
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: grown
      app.kubernetes.io/component: zitadel
      app.kubernetes.io/instance: grown
  template:
    metadata:
      labels:
        app.kubernetes.io/name: grown
        app.kubernetes.io/instance: grown
        app.kubernetes.io/managed-by: Helm
        helm.sh/chart: grown-0.3.0
        app.kubernetes.io/component: zitadel
    spec:
      # Zitadel runs as a non-root user (uid 1000). fsGroup makes the shared RWO
      # PVC group-owned and group-writable so start-from-init can write the
      # bootstrap PAT to /shared (otherwise: "open /shared/...: permission denied").
      securityContext:
        fsGroup: 1000
      initContainers:
        # Wait for Postgres to accept connections before init.
        - name: wait-for-postgres
          image: "postgres:17.2-alpine"
          command:
            - sh
            - -c
            - |
              until pg_isready -h grown-postgres.grown.svc.cluster.local -p 5432 -U grown; do
                echo "waiting for postgres..."; sleep 3
              done
      containers:
        - name: zitadel
          image: "ghcr.io/zitadel/zitadel:v2.71.0"
          imagePullPolicy: IfNotPresent
          args:
            - start-from-init
            - --masterkeyFromEnv
            - --tlsMode
            - disabled
          envFrom:
            - secretRef:
                name: grown-zitadel-config
          ports:
            - name: http
              containerPort: 8080
          volumeMounts:
            - name: shared
              mountPath: /shared
          # start-from-init runs init + setup (migrations, projections, first
          # instance) and only THEN starts the server. That one-shot sequence is
          # NOT idempotent — if it is killed part-way (e.g. a premature liveness
          # failure) the next boot fails on a duplicate default-instance domain.
          # A startupProbe gates liveness until the server is actually up, giving
          # setup up to ~10 min (failureThreshold * periodSeconds) on a fresh DB.
          startupProbe:
            httpGet: { path: /debug/healthz, port: 8080 }
            periodSeconds: 5
            failureThreshold: 120
          readinessProbe:
            httpGet: { path: /debug/ready, port: 8080 }
            initialDelaySeconds: 10
            periodSeconds: 5
            failureThreshold: 60
          livenessProbe:
            httpGet: { path: /debug/healthz, port: 8080 }
            periodSeconds: 20
            failureThreshold: 6
          resources:
            limits:
              memory: 1Gi
            requests:
              cpu: 100m
              memory: 256Mi
      volumes:
        # Shared between the zitadel container and the provisioning Job via a
        # PVC so the bootstrap PAT survives and is readable cross-pod.
        - name: shared
          persistentVolumeClaim:
            claimName: grown-zitadel-shared
---
# Source: grown/templates/postgres.yaml
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: grown-postgres
  labels:
    app.kubernetes.io/name: grown
    app.kubernetes.io/instance: grown
    app.kubernetes.io/managed-by: Helm
    helm.sh/chart: grown-0.3.0
    app.kubernetes.io/component: postgres
spec:
  serviceName: grown-postgres
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: grown
      app.kubernetes.io/component: postgres
      app.kubernetes.io/instance: grown
  template:
    metadata:
      labels:
        app.kubernetes.io/name: grown
        app.kubernetes.io/instance: grown
        app.kubernetes.io/managed-by: Helm
        helm.sh/chart: grown-0.3.0
        app.kubernetes.io/component: postgres
    spec:
      containers:
        - name: postgres
          image: "postgres:17.2-alpine"
          imagePullPolicy: IfNotPresent
          envFrom:
            - secretRef:
                name: grown-postgres
          env:
            - name: PGDATA
              value: /var/lib/postgresql/data/pgdata
          ports:
            - name: postgres
              containerPort: 5432
          volumeMounts:
            - name: data
              mountPath: /var/lib/postgresql/data
            - name: init
              mountPath: /docker-entrypoint-initdb.d
          readinessProbe:
            exec:
              command: ["sh", "-c", "pg_isready -U $POSTGRES_USER -d $POSTGRES_DB"]
            initialDelaySeconds: 5
            periodSeconds: 5
            failureThreshold: 30
          livenessProbe:
            exec:
              command: ["sh", "-c", "pg_isready -U $POSTGRES_USER -d $POSTGRES_DB"]
            initialDelaySeconds: 20
            periodSeconds: 20
          resources:
            limits:
              memory: 1Gi
            requests:
              cpu: 100m
              memory: 256Mi
      volumes:
        - name: init
          configMap:
            name: grown-postgres-init
            defaultMode: 0755
  volumeClaimTemplates:
    - metadata:
        name: data
      spec:
        accessModes: ["ReadWriteOnce"]
        resources:
          requests:
            storage: 10Gi
---
# Source: grown/templates/rustfs.yaml
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: grown-rustfs
  labels:
    app.kubernetes.io/name: grown
    app.kubernetes.io/instance: grown
    app.kubernetes.io/managed-by: Helm
    helm.sh/chart: grown-0.3.0
    app.kubernetes.io/component: rustfs
spec:
  serviceName: grown-rustfs
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: grown
      app.kubernetes.io/component: rustfs
      app.kubernetes.io/instance: grown
  template:
    metadata:
      labels:
        app.kubernetes.io/name: grown
        app.kubernetes.io/instance: grown
        app.kubernetes.io/managed-by: Helm
        helm.sh/chart: grown-0.3.0
        app.kubernetes.io/component: rustfs
    spec:
      securityContext:
        fsGroup: 10001
        fsGroupChangePolicy: OnRootMismatch
        runAsGroup: 10001
        runAsNonRoot: true
        runAsUser: 10001
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: rustfs
          image: "rustfs/rustfs:1.0.0-beta.7"
          imagePullPolicy: IfNotPresent
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
              - ALL
          env:
            - name: RUSTFS_VOLUMES
              value: /data
            - name: RUSTFS_ADDRESS
              value: ":9100"
            - name: RUSTFS_CONSOLE_ENABLE
              value: "false"
            # "" => logs to stdout (the image default /logs is not a volume).
            - name: RUSTFS_OBS_LOG_DIRECTORY
              value: ""
            - name: RUSTFS_ACCESS_KEY
              valueFrom:
                secretKeyRef: { name: grown-rustfs, key: access_key }
            - name: RUSTFS_SECRET_KEY
              valueFrom:
                secretKeyRef: { name: grown-rustfs, key: secret_key }
          ports:
            - { name: s3, containerPort: 9100 }
          volumeMounts:
            - name: data
              mountPath: /data
          readinessProbe:
            httpGet: { path: /health, port: s3 }
            initialDelaySeconds: 5
            periodSeconds: 5
            failureThreshold: 30
          livenessProbe:
            httpGet: { path: /health, port: s3 }
            initialDelaySeconds: 20
            periodSeconds: 20
            failureThreshold: 6
          resources:
            limits:
              memory: 1Gi
            requests:
              cpu: 100m
              memory: 256Mi
  # volumeClaimTemplates PVCs (data-<release>-rustfs-0) are never deleted by
  # `helm uninstall`/upgrade — Kubernetes leaves them in place by design.
  volumeClaimTemplates:
    - metadata:
        name: data
      spec:
        accessModes: ["ReadWriteOnce"]
        resources:
          requests:
            storage: 20Gi
