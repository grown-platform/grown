# Source: grown/templates/zitadel.yaml
apiVersion: apps/v1
kind: Deployment
metadata:
  name: grown-zitadel
  labels:
    app.kubernetes.io/name: grown
    app.kubernetes.io/instance: grown
    app.kubernetes.io/managed-by: Helm
    helm.sh/chart: grown-0.4.0
    app.kubernetes.io/component: zitadel
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: grown
      app.kubernetes.io/component: zitadel
      app.kubernetes.io/instance: grown
  template:
    metadata:
      labels:
        app.kubernetes.io/name: grown
        app.kubernetes.io/instance: grown
        app.kubernetes.io/managed-by: Helm
        helm.sh/chart: grown-0.4.0
        app.kubernetes.io/component: zitadel
    spec:
      # Zitadel runs as a non-root user (uid 1000). fsGroup makes the shared RWO
      # PVC group-owned and group-writable so start-from-init can write the
      # bootstrap PAT to /shared (otherwise: "open /shared/...: permission denied").
      securityContext:
        fsGroup: 1000
      initContainers:
        # Wait for Postgres to accept connections before init.
        - name: wait-for-postgres
          image: "postgres:17.2-alpine"
          command:
            - sh
            - -c
            - |
              until pg_isready -h grown-postgres.grown.svc.cluster.local -p 5432 -U grown; do
                echo "waiting for postgres..."; sleep 3
              done
      containers:
        - name: zitadel
          image: "ghcr.io/zitadel/zitadel:v2.71.0"
          imagePullPolicy: IfNotPresent
          args:
            - start-from-init
            - --masterkeyFromEnv
            - --tlsMode
            - disabled
          envFrom:
            - secretRef:
                name: grown-zitadel-config
          ports:
            - name: http
              containerPort: 8080
          volumeMounts:
            - name: shared
              mountPath: /shared
          # start-from-init runs init + setup (migrations, projections, first
          # instance) and only THEN starts the server. That one-shot sequence is
          # NOT idempotent — if it is killed part-way (e.g. a premature liveness
          # failure) the next boot fails on a duplicate default-instance domain.
          # A startupProbe gates liveness until the server is actually up, giving
          # setup up to ~10 min (failureThreshold * periodSeconds) on a fresh DB.
          startupProbe:
            httpGet: { path: /debug/healthz, port: 8080 }
            periodSeconds: 5
            failureThreshold: 120
          readinessProbe:
            httpGet: { path: /debug/ready, port: 8080 }
            initialDelaySeconds: 10
            periodSeconds: 5
            failureThreshold: 60
          livenessProbe:
            httpGet: { path: /debug/healthz, port: 8080 }
            periodSeconds: 20
            failureThreshold: 6
          resources:
            limits:
              memory: 1Gi
            requests:
              cpu: 100m
              memory: 256Mi
      volumes:
        # Shared between the zitadel container and the provisioning Job via a
        # PVC so the bootstrap PAT survives and is readable cross-pod.
        - name: shared
          persistentVolumeClaim:
            claimName: grown-zitadel-shared
