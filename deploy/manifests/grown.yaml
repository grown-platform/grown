            - name: OWNER_USERNAME
              valueFrom:
                secretKeyRef: { name: grown-homeassistant-owner, key: username }
            - name: OWNER_PASSWORD
              valueFrom:
                secretKeyRef: { name: grown-homeassistant-owner, key: password }
            - name: OWNER_NAME
              value: "Administrator"
            - name: OWNER_LANGUAGE
              value: "en"
            - name: RECHECK_SECONDS
              value: "60"
            - { name: PYTHONDONTWRITEBYTECODE, value: "1" }
          securityContext:
            runAsNonRoot: true
            runAsUser: 65534
            runAsGroup: 65534
            readOnlyRootFilesystem: true
            allowPrivilegeEscalation: false
            privileged: false
            capabilities:
              drop: ["ALL"]
          volumeMounts:
            - { name: seed, mountPath: /seed, readOnly: true }
          resources:
            requests: { cpu: 5m, memory: 24Mi }
            limits: { memory: 64Mi }
      volumes:
        - name: seed
          configMap:
            name: grown-homeassistant-seed
  # config-<release>-homeassistant-0 holds ALL of HA's state (config, .storage,
  # the recorder DB). Kubernetes never deletes volumeClaimTemplate PVCs on
  # `helm uninstall`/upgrade.
  volumeClaimTemplates:
    - metadata:
        name: config
      spec:
        accessModes: ["ReadWriteOnce"]
        resources:
          requests:
            storage: 5Gi
