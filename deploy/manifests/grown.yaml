          env:
            - { name: CONFIG_DIR, value: /config }
            - { name: SEED_DIR, value: /seed }
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
              - ALL
            privileged: false
          volumeMounts:
            - { name: config, mountPath: /config }
            - { name: seed, mountPath: /seed, readOnly: true }
