            limits: { memory: 128Mi }
      containers:
        - name: homeassistant
          image: "ghcr.io/home-assistant/home-assistant:2026.9.4"
          imagePullPolicy: IfNotPresent
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
              - ALL
            privileged: false
          env:
            - name: TZ
              value: "UTC"
          ports:
            - { name: http, containerPort: 8123 }
          volumeMounts:
            - { name: config, mountPath: /config }
